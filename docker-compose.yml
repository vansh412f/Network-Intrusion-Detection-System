networks:
  nids-network:
    driver: bridge

services:

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    networks:
      - nids-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_SENSOR_URL: ""
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - nids-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Sensor ─────────────────────────────────────────────────────────────────
  # Build context is repo root so /ml/ directory is accessible alongside /sensor/
  sensor:
    build:
      context: .
      dockerfile: sensor/Dockerfile
    env_file:
      - ./.env
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    networks:
      - nids-network
    restart: unless-stopped
